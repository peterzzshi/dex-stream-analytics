[package]
name = "dex-ingester-common"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
apache-avro = "0.22.0"
tracing = "0.1"
cloudevents-sdk = { version = "0.9", default-features = false }
chrono = "0.4"
thiserror = "2.0"
anyhow = "1"
reqwest = "0.13.5"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
