[pyth]
max_age_seconds = 60

# pyth_account: a Pyth receiver PriceUpdateV2 account; pyth_feed_id: the 64-hex feed id
# that account must hold. The oracle reads the id out of the account and rejects the price
# on mismatch, so the two must be configured together. Receiver accounts are per-poster,
# so an address can go stale; the feed id is the stable identity.
[[tokens]]
mint = "So11111111111111111111111111111111111111112"
symbol = "SOL"
pyth_account = "7UVimffxr9ow1uXYxsr4LHAcV58mLzhmwaeKvJ1pjLiE"
pyth_feed_id = "ef0d8b6fda2ceba41da15d4095d1da392a0d2f8ed0c6c7bc0f4cfac8c280b56d"

