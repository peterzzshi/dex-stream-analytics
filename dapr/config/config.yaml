apiVersion: dapr.io/v2alpha1
kind: Configuration
metadata:
  name: dex-analytics-config
  namespace: default
spec:
  # Tracing disabled: no Zipkin backend is part of the local stack.
  tracing:
    samplingRate: "0"

  metric:
    enabled: true

  # Access control for pub/sub
  accessControl:
    defaultAction: allow
    trustDomain: "public"

  # API logging
  logging:
    apiLogging:
      enabled: true
      obfuscateURLs: false