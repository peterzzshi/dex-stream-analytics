[package]
name = "solana-ingester"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"

[dependencies]
dex-ingester-common = { path = "../common" }
# Solana RPC
solana-client = "4.4.0"
solana-sdk = "5.0.0"
solana-message = "6.0.0"
solana-transaction-status = { version = "4.4.0", features = ["agave-unstable-api"] }
solana-commitment-config = "3.1.1"

# Async runtime
tokio = { version = "1.35", features = ["full"] }
futures-util = "0.3"

# Config / serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "=0.8.23"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"

# Random number generation (for retry jitter)
rand = "0.10.3"

# HTTP server for health checks
warp = { version = "0.4.3", features = ["server"] }
