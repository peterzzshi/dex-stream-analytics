# Ingester configuration — EVM chains only.
#
# Chains and pools are declared here rather than passed as environment variables, so the
# set of monitored venues is reviewable and versioned. Secrets are not: a value written
# in the dollar-brace form below is read from the environment at startup, and startup
# fails if the named variable is unset. Note that expansion runs over the whole file,
# comments included — never write a placeholder in a comment.
#
# This binary handles only EVM chains. Solana uses a separate Rust ingester.

dapr:
  host: evm-ingester-dapr
  httpPort: 3500
  pubsubName: kafka-pubsub

topics:
  trading: dex-trading-events
  liquidity: dex-liquidity-events

app:
  port: 3000

chains:
  - chain: eip155:1 # CAIP-2; eip155 is the EVM namespace, 1 is Ethereum mainnet
    name: Ethereum
    rpc: ${ETH_RPC_URL} # WebSocket endpoint; must be wss:// or ws://
    venue: uniswap-v2
    confirmations: 64 # blocks buffered before publish; 0 disables the gate
    pools:
      # Uniswap V2 USDC/WETH. Token order is USDC first because V2 sorts tokens by
      # address, so USDC is token0 and WETH is token1 — this determines which swap
      # amounts land in amount0 vs amount1.
      - pairAddress: "0xB4e16d0168e52d35CaCD2c6185b44281Ec28C9Dc"
        name: USDC/WETH
