[package]
name = "evm-ingester"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"

[dependencies]
dex-ingester-common = { path = "../common" }
ethers = { version = "2.0", features = ["ws"] }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "=0.8.23"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
rand = "0.10.3"

