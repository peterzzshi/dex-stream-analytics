[package]
name = "solana-ingester"
version = "0.1.0"
edition = "2024"

[dependencies]
# Solana RPC
solana-client = "2.0"
solana-sdk = "2.0"
solana-transaction-status = "2.0"
solana-account-decoder = "2.0"

# Pyth oracle (modern receiver SDK)
pyth-solana-receiver-sdk = "2.0"

# Avro serialization
apache-avro = "0.22.0"

# HTTP client (Dapr publish)
reqwest = { version = "0.11", features = ["json"] }

# Async runtime
tokio = { version = "1.35", features = ["full"] }
futures-util = "0.3"

# Config / serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0.21"

# Random number generation (for retry jitter)
rand = "0.8"

# Base58 (Solana addresses)
bs58 = "0.5"

# Time
chrono = "0.4"

# Base64 encoding
base64 = "0.23.1"

# HTTP server for health checks
warp = { version = "0.4.3", features = ["server"] }
anchor-lang = "1.2.1"

# SPL Token Metadata
mpl-token-metadata = "4.1"
