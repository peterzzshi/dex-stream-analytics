[package]
name = "evm-ingester"
version = "0.1.0"
edition = "2021"

[dependencies]
ethers = { version = "2.0", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
apache-avro = "0.16"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
chrono = "0.4"
hex = "0.4"
futures = "0.3"
rand = "0.8"

[dev-dependencies]
mockito = "1.5"
tokio-test = "0.4"
tempfile = "3"
