# Pub/sub and topic names shared by both ingesters
x-topics: &topics
  TOPIC_TRADING: bridge-transfer-events
  TOPIC_LIQUIDITY: bridge-supply-events
  TOPIC_DLQ: bridge-dlq-events

x-ingester-env: &ingester-env
  <<: *topics
  PUBSUB_NAME: kafka-pubsub

services:
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      # Only the host listener is published. The in-container one advertises `kafka:9092`,
      # which a host client cannot resolve, so publishing 9092 would only ever confuse.
      - "29092:29092"
    environment:
      CLUSTER_ID: "Yi30LVX8TlCMOk1KHapf-A"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://kafka:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - dex-analytics-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # One-shot topic provisioning (auto-create is disabled on the broker)
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init
    environment:
      <<: *topics
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -c
      - >
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic $$TOPIC_TRADING --partitions 6 --replication-factor 1 --config retention.ms=604800000 &&
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic $$TOPIC_LIQUIDITY --partitions 6 --replication-factor 1 --config retention.ms=2592000000 &&
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic $$TOPIC_DLQ --partitions 3 --replication-factor 1 --config retention.ms=2592000000 &&
        echo "All topics created"
    networks:
      - dex-analytics-network

  # EVM ingester: Rust service listening to EVM blockchain events
  # Requires ETH_RPC_URL in .env
  evm-ingester:
    build:
      context: .
      dockerfile: evm-ingester/Dockerfile
    container_name: evm-ingester
    environment:
      <<: *ingester-env
      ETH_RPC_URL: ${ETH_RPC_URL}
      CONFIG_FILE: /app/evm.toml
      DAPR_HOST: evm-ingester-dapr
      DAPR_HTTP_PORT: "3500"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      evm-ingester-dapr:
        condition: service_healthy
    networks:
      - dex-analytics-network
    restart: unless-stopped

  # DAPR sidecar for evm-ingester
  evm-ingester-dapr:
    image: daprio/daprd:1.12.0
    container_name: evm-ingester-dapr
    command: [
      "./daprd",
      "-app-id", "evm-ingester",
      "-dapr-http-port", "3500",
      "-dapr-grpc-port", "50001",
      "-components-path", "/components",
      "-config", "/config/config.yaml",
      "-log-level", "info"
    ]
    volumes:
      - ./dapr/components:/components
      - ./dapr/config:/config
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "/daprd", "--version" ]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 5s
    networks:
      - dex-analytics-network
    restart: unless-stopped

  # Solana ingester: Rust service listening to Solana blockchain events
  # Requires SOLANA_RPC_URL in .env
  solana-ingester:
    build:
      context: .
      dockerfile: solana-ingester/Dockerfile
    container_name: solana-ingester
    environment:
      <<: *ingester-env
      SOLANA_RPC_URL: ${SOLANA_RPC_URL}
      SOLANA_COMMITMENT: finalized
      CONFIG_FILE: /app/solana.toml
      DAPR_HOST: solana-ingester-dapr
      DAPR_HTTP_PORT: "3501"
      APP_PORT: "3001"
      FINALITY_BUFFER_SIZE: "100"
      FINALITY_POLL_INTERVAL_SECS: "1"
    ports:
      - "3001:3001"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      solana-ingester-dapr:
        condition: service_healthy
    networks:
      - dex-analytics-network
    restart: unless-stopped

  # DAPR sidecar for solana-ingester
  # No -app-port: the ingester only serves /health and consumes nothing, so pointing
  # daprd at it would just make it poll /dapr/subscribe against a route that 404s.
  solana-ingester-dapr:
    image: daprio/daprd:1.12.0
    container_name: solana-ingester-dapr
    command: [
      "./daprd",
      "-app-id", "solana-ingester",
      "-dapr-http-port", "3501",
      "-dapr-grpc-port", "50003",
      "-components-path", "/components",
      "-config", "/config/config.yaml",
      "-log-level", "info"
    ]
    volumes:
      - ./dapr/components:/components
      - ./dapr/config:/config
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "/daprd", "--version" ]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 5s
    networks:
      - dex-analytics-network
    restart: unless-stopped

  # Flink JobManager in application mode: builds the aggregator jar and runs
  # the StreamProcessor job on startup (no manual `flink run` needed).
  flink-jobmanager:
    build:
      context: .
      dockerfile: aggregator/Dockerfile
    image: dex-analytics-aggregator:latest
    container_name: flink-jobmanager
    command: standalone-job --job-classname com.web3analytics.BridgeStreamProcessor
    environment:
      # TaskManagers connect via this hostname — without it the JM announces
      # its container hostname and TM registration messages get dropped.
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - BRIDGE_TRANSFER_TOPIC=${TOPIC_TRADING}
      - BRIDGE_SUPPLY_TOPIC=${TOPIC_LIQUIDITY}
      # analytics-service has not been migrated to bridge routes yet; these
      # paths model the intended contract and will 404 until it is.
      - TRANSFER_VOLUME_ENDPOINT=http://analytics-service:8080/api/bridges/transfer-volume
      - SUPPLY_TRACKING_ENDPOINT=http://analytics-service:8080/api/bridges/supply
      - CROSS_CHAIN_FLOW_ENDPOINT=http://analytics-service:8080/api/bridges/flow
      - EXPLOIT_DETECTION_ENDPOINT=http://analytics-service:8080/api/bridges/alert
      - REENTRANCY_DETECTION_ENDPOINT=http://analytics-service:8080/api/bridges/reentrancy
      - WATERMARK_DELAY_SECONDS=5
      - TRANSFER_WINDOW_SECONDS=300
      - SUPPLY_WINDOW_SECONDS=300
      - FLOW_WINDOW_SECONDS=300
      - EXPLOIT_SESSION_GAP_SECONDS=60
      - REENTRANCY_WINDOW_SECONDS=5
      # Bounded restarts: a permanently failing sink ends as a failed job, not a loop. Without
      # checkpointing, a restart replays the topic from earliest.
      - RESTART_MAX_ATTEMPTS=3
      - RESTART_DELAY_SECONDS=10
      - CHECKPOINT_INTERVAL_SECONDS=60
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8081:8081"
    networks:
      - dex-analytics-network
    restart: unless-stopped

  # Flink TaskManager workers. Uses the job image: in standalone application
  # mode the user jar must be present on TaskManagers too (no blob shipping).
  flink-taskmanager:
    image: dex-analytics-aggregator:latest
    container_name: flink-taskmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
    depends_on:
      - flink-jobmanager
    networks:
      - dex-analytics-network
    restart: unless-stopped

  # Redis for analytics persistence
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - dex-analytics-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Analytics Service: Kotlin/Ktor service for bridge security analytics
  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    container_name: analytics-service
    environment:
      - APP_PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8080:8080"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - dex-analytics-network
    restart: unless-stopped

  # DAPR sidecar for analytics-service
  analytics-service-dapr:
    image: daprio/daprd:1.12.0
    container_name: analytics-service-dapr
    command: [
      "./daprd",
      "-app-id", "analytics-service",
      "-app-port", "8080",
      "-app-protocol", "http",
      "-app-channel-address", "analytics-service",
      "-dapr-http-port", "3502",
      "-dapr-grpc-port", "50002",
      "-components-path", "/components",
      "-config", "/config/config.yaml",
      "-log-level", "info"
    ]
    volumes:
      - ./dapr/components:/components
      - ./dapr/config:/config
      # Declarative subscriptions must live in the components/resources path —
      # a separate /subscriptions mount is never read by self-hosted daprd.
      - ./dapr/subscriptions/analytics-subscriptions.yaml:/components/analytics-subscriptions.yaml:ro
    depends_on:
      analytics-service:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    networks:
      - dex-analytics-network
    restart: unless-stopped

networks:
  dex-analytics-network:
    driver: bridge

volumes:
  kafka-data:
