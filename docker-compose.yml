services:
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      CLUSTER_ID: "Yi30LVX8TlCMOk1KHapf-A"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://kafka:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - dex-analytics-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  # One-shot topic provisioning (auto-create is disabled on the broker)
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -c
      - >
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic dex-trading-events --partitions 6 --replication-factor 1 --config retention.ms=604800000 &&
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic dex-liquidity-events --partitions 6 --replication-factor 1 --config retention.ms=2592000000 &&
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic dex-trading-analytics --partitions 3 --replication-factor 1 --config retention.ms=2592000000 &&
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic dex-liquidity-analytics --partitions 3 --replication-factor 1 --config retention.ms=7776000000 &&
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic dex-pattern-analytics --partitions 3 --replication-factor 1 --config retention.ms=2592000000 &&
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic dex-market-trends --partitions 3 --replication-factor 1 --config retention.ms=2592000000 &&
        echo "All topics created"
    networks:
      - dex-analytics-network

  # DAPR placement service for actor runtime
  dapr-placement:
    image: daprio/dapr:1.12.0
    container_name: dapr-placement
    command: ["./placement", "-port", "50006", "-log-level", "debug"]
    ports:
      - "50006:50006"
    networks:
      - dex-analytics-network

  # Ingester: Go service listening to blockchain events
  ingester:
    build:
      context: ./ingester
      dockerfile: Dockerfile
    container_name: ingester
    environment:
      - POLYGON_RPC_URL=${POLYGON_RPC_URL}
      - PAIR_ADDRESS=${PAIR_ADDRESS}
      - DAPR_HOST=ingester-dapr
      - DAPR_HTTP_PORT=3500
      - DAPR_GRPC_PORT=50001
      - PUBSUB_NAME=kafka-pubsub
      - TOPIC_TRADING_EVENTS=dex-trading-events
      - TOPIC_LIQUIDITY_EVENTS=dex-liquidity-events
      - APP_PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      dapr-placement:
        condition: service_started
    networks:
      - dex-analytics-network
    restart: unless-stopped
    profiles:
      - live

  # DAPR sidecar for ingester
  ingester-dapr:
    image: daprio/daprd:1.12.0
    container_name: ingester-dapr
    command: [
      "./daprd",
      "-app-id", "ingester",
      "-app-port", "3000",
      "-app-protocol", "http",
      "-app-channel-address", "ingester",
      "-dapr-http-port", "3500",
      "-dapr-grpc-port", "50001",
      "-components-path", "/components",
      "-config", "/config/config.yaml",
      "-log-level", "info",
      "-placement-host-address", "dapr-placement:50006"
    ]
    volumes:
      - ./dapr/components:/components
      - ./dapr/config:/config
    depends_on:
      - ingester
    networks:
      - dex-analytics-network
    profiles:
      - live

  # Flink JobManager in application mode: builds the aggregator jar and runs
  # the StreamProcessor job on startup (no manual `flink run` needed).
  flink-jobmanager:
    build:
      context: ./aggregator
      dockerfile: Dockerfile
    image: dex-analytics-aggregator:latest
    container_name: flink-jobmanager
    command: standalone-job --job-classname com.web3analytics.StreamProcessor
    environment:
      # TaskManagers connect via this hostname — without it the JM announces
      # its container hostname and TM registration messages get dropped.
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - TOPIC_TRADING_EVENTS=dex-trading-events
      - TOPIC_LIQUIDITY_EVENTS=dex-liquidity-events
      - TOPIC_TRADING_ANALYTICS=dex-trading-analytics
      - TOPIC_LIQUIDITY_ANALYTICS=dex-liquidity-analytics
      - TOPIC_PATTERN_ANALYTICS=dex-pattern-analytics
      - TOPIC_MARKET_TRENDS=dex-market-trends
      - FLINK_CONSUMER_GROUP=dex-processor
      - FLINK_PARALLELISM=2
      - FLINK_CHECKPOINT_MS=10000
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8081:8081"
    networks:
      - dex-analytics-network
    restart: unless-stopped

  # Flink TaskManager workers. Uses the job image: in standalone application
  # mode the user jar must be present on TaskManagers too (no blob shipping).
  flink-taskmanager:
    image: dex-analytics-aggregator:latest
    container_name: flink-taskmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
    depends_on:
      - flink-jobmanager
    networks:
      - dex-analytics-network
    restart: unless-stopped

  # Redis for analytics persistence
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - dex-analytics-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Analytics Service: Kotlin sink/query service for aggregated analytics
  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    container_name: analytics-service
    environment:
      - APP_PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8080:8080"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      dapr-placement:
        condition: service_started
    networks:
      - dex-analytics-network
    restart: unless-stopped

  # DAPR sidecar for analytics-service
  analytics-service-dapr:
    image: daprio/daprd:1.12.0
    container_name: analytics-service-dapr
    command: [
      "./daprd",
      "-app-id", "analytics-service",
      "-app-port", "8080",
      "-app-protocol", "http",
      "-app-channel-address", "analytics-service",
      "-dapr-http-port", "3501",
      "-dapr-grpc-port", "50002",
      "-components-path", "/components",
      "-config", "/config/config.yaml",
      "-log-level", "info",
      "-placement-host-address", "dapr-placement:50006"
    ]
    volumes:
      - ./dapr/components:/components
      - ./dapr/config:/config
      # Declarative subscriptions must live in the components/resources path —
      # a separate /subscriptions mount is never read by self-hosted daprd.
      - ./dapr/subscriptions/analytics-subscriptions.yaml:/components/analytics-subscriptions.yaml:ro
    depends_on:
      analytics-service:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    networks:
      - dex-analytics-network

networks:
  dex-analytics-network:
    driver: bridge

volumes:
  kafka-data:
